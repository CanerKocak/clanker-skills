name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Verify generated native packages
        run: python3 scripts/sync_platform_packages.py --check
      - name: Validate skills, packages, and metadata
        run: python3 scripts/validate_repository.py
